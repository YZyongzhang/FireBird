<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/vditor.css">
    <title>Document</title>
</head>

<body>
    <div class=" main_page ">
        <div class=" left_region ">
            <div class=" top_profile ">
                <img src="/img/src/avatar.jpg" alt="avatar" class="avatar">

                <div class="user-info">
                    <span class="username">yongzhang</span>
                    <span class="user-role">管理员</span>
                </div>
            </div>
            <div class=" chose ">

                <div class="accordion">

                    <div class="accordion-item">
                        <div class="accordion-header">欢迎使用</div>
                        <div class="accordion-contents">
                            <div class="accordion-content">使用教程</div>
                        </div>
                    </div>

                </div>

            </div>
            <div class=" bottom_region "></div>
        </div>

        <div class="main_content">
            <div id="editor-wrapper">
                <div id="editor"></div>
            </div>
        </div>

    </div>

    <!-- 鼠标右键菜单 -->
    <ul id="context-menu">
        <li id="add">添加
            <ul id="sub-menu">
                <li id="addFitem">添加父项</li>
                <li id="addCitem">添加子项</li>
            </ul>
        </li>
        <li id="delete">删除</li>
        <li id="rename">重命名</li>
        <li id="property">属性

        </li>
    </ul>

</body>

</html>

<style>
    body {
        margin: 0px;
    }

    .main_page {
        height: 100vh;
        width: 100vw;
        display: flex;
    }

    .left_region {
        height: 100vh;
        display: flex;
        flex-direction: column;
        flex: 1;

    }

    .top_profile {
        display: flex;
        align-items: center;
        gap: 10px;

        padding: 6px 12px;
        cursor: pointer;

        transition: background-color 0.2s;
    }

    .top_profile:hover {
        background-color: #f2f3f5;
    }

    .avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        object-fit: cover;
        border: 1px solid #ddd;
    }

    .user-info {
        display: flex;
        flex-direction: column;
        line-height: 1.2;
    }

    .username {
        font-size: 14px;
        font-weight: 500;
        color: #333;
    }

    .user-role {
        font-size: 12px;
        color: #999;
    }

    .chose {
        flex: 10;
        /* background-color: rgb(228, 12, 12); */
    }

    .accordion {
        overflow: hidden;
    }

    .accordion-header {
        background-color: #f0f0f0;
        padding: 15px;
        cursor: pointer;
        user-select: none;
        font-weight: bold;
        border-bottom: 1px solid #ccc;
    }

    .accordion-contents {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
        background-color: #fff;
    }

    /* 单条内容，不再做高度动画 */
    .accordion-content {
        padding: 10px 15px;
        border-top: 1px solid #eee;

        font-size: 14px;
        line-height: 1.6;
        color: #333;

        transition: background-color 0.2s ease;
    }

    .accordion-content:hover {
        background-color: #f5f7fa;
        cursor: pointer;
    }

    .accordion-content.active {
        background-color: #eef3ff;
    }



    .bottom_region {
        flex: 1;
        /* background-color: rgb(6, 157, 107); */
    }

    .main_content {
        height: 100vh;
        flex: 5;
        /* background-color: lightblue; */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    #editor-wrapper {
        /* flex: 1; */
        width: 100%;
        height: 100%;
        /* background-color: blue; */
    }


    #context-menu {
        position: absolute;
        background: #fff;
        border: 1px solid #ccc;
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
        display: none;
        z-index: 1000;
        padding: 0;
        margin: 0;
        list-style: none;
        width: 150px;
    }

    #sub-menu {
        display: none;
        position: absolute;
        top: 0;
        left: 100%;
        background: #fff;
        border: 1px solid #ccc;
        list-style: none;
        padding: 0;
        margin: 0;
        min-width: 120px;
        z-index: 1000;
    }

    #context-menu li {
        padding: 8px 12px;
        cursor: pointer;
    }

    #context-menu li:hover {
        background-color: #f0f0f0;
    }

    #context-menu>li:hover #sub-menu {
        display: block;
    }

    #sub-menu li {
        padding: 6px 12px;
        cursor: pointer;
    }

    #sub-menu li:hover {
        background-color: #eee;
    }
</style>

<script src="/js/vditor.js"></script>

<script>
    const menu = document.getElementById('context-menu');
    const markdownFromDB = `# 欢迎使用狂鸟 
当一只鸟要起飞时，拦都拦不住`;
    const wrapper = document.getElementById('editor-wrapper');
    const height = wrapper.clientHeight;
    let currentFilePath = ''; // 当前打开的文件路径
    const vditor = new Vditor('editor', {
        height: height,
        mode: 'ir',
        cache: { enable: false },
        value: markdownFromDB,
        input: debounce(async (value) => {
            console.log('当前输入的内容：', value);
            await saveContent(currentFilePath, value);
        }, 50)
    });

    fetch('/api/get_file')
        .then(res => res.json())
        .then(data => {
            renderAccordion(data);
        });

    function renderAccordion(data) {
        const accordion = document.getElementsByClassName('accordion')[0];

        Object.entries(data.Path).forEach(([sectionName, items]) => {
            // 一级标题
            const itemDiv = document.createElement('div');
            itemDiv.className = 'accordion-item';

            const header = document.createElement('div');
            header.className = 'accordion-header';
            header.textContent = sectionName;

            const contents = document.createElement('div');
            contents.className = 'accordion-contents';

            // 二级内容
            items.forEach(([title, path]) => {
                const content = document.createElement('div');
                content.className = 'accordion-content';
                content.textContent = title;

                // 点击加载 markdown
                content.addEventListener('click', () => {
                    setCurrentFile(path);
                    loadMarkdown(path);
                });

                contents.appendChild(content);
            });

            itemDiv.appendChild(header);
            itemDiv.appendChild(contents);
            accordion.appendChild(itemDiv);
            header_listener(header)

        });
    }
    function loadMarkdown(path) {
        fetch(`/getcontent?path=${encodeURIComponent(path)}`)
            .then(res => res.json())
            .then(data => {
                renderMarkdown(data.content);
            })

    }

    function renderMarkdown(markdownFromDB) {
        if (!vditor) {
            vditor = new Vditor('editor', {
                height: 500,
                mode: 'ir',
                cache: { enable: false },
                value: markdownFromDB,
                input: (value) => {
                    console.log('当前输入的内容：', value);
                }
            });
        } else {
            vditor.setValue(markdownFromDB);
        }
    }

    function debounce(fn, delay) {
        let timer;
        return function (...args) {
            clearTimeout(timer);
            timer = setTimeout(() => fn.apply(this, args), delay);
        };
    }

    function setCurrentFile(path) {
        currentFilePath = path;
    }


    async function saveContent(path, content) {
        try {
            const res = await fetch('/save_content', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path, content })
            });
            const data = await res.json();
            if (data.success) {
                console.log('保存成功');
            } else {
                console.error('保存失败', data.error);
            }
        } catch (err) {
            console.error('保存请求失败', err);
        }
    }

    // 控制折叠面板折叠
    function header_listener(header) {
        
            header.addEventListener('click', () => {
                const content = header.nextElementSibling;

                // 如果已经展开，则收起
                if (content.style.maxHeight) {
                    content.style.maxHeight = null;
                } else {
                    // 先关闭其他面板（可选，让只展开一个）
                    document.querySelectorAll('.accordion-content').forEach(c => c.style.maxHeight = null);

                    // 展开当前面板
                    content.style.maxHeight = content.scrollHeight + "px";
                }
            });

            header.addEventListener('contextmenu', function (e) {
                e.preventDefault(); // 阻止浏览器默认右键菜单
                console.log('鼠标右键被点击了', e);
                // 在这里可以添加自定义逻辑，比如显示自定义菜单
                menu.style.top = e.clientY + 'px';
                menu.style.left = e.clientX + 'px';
                menu.style.display = 'block';
                menu.dataset.key = header.textContent
            });
        
    }

    // 对每一个可选项进行编号
    // const items = 


    menu.addEventListener('click', function (e) {
        const action = e.target.id;
        
        if (action == "addCitem") {
            key = menu.dataset.key
            name = 'testF'
            fetch('/addCitem', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key, name })
            });

        }
        menu.style.display = 'none';
    });


    document.addEventListener('click', function (e) {
        if (e.target !== menu) {
            menu.style.display = 'none';
        }
    });





</script>
