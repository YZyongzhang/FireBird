<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="main_page">
        <div class="login_region"> <!--登录区域 -->
            <div class="login_username">
                <input id="username" type="text">
            </div>
            <div class="login_password">
                <input id="password" type="password">
            </div>
            <div class="login_button">
                <button id="submit_button">登录</button>
            </div>
        </div>
    </div>
</body>

</html>

<style>
    body {
        margin: 0px;
    }

    .main_page {
        height: 100vh;
        width: 100vw;
        /* background-color: black; */
        background-image: url(./img/src/login_page_background.jpg);
        background-size: cover;
        /* background-position: center; */
        background-repeat: no-repeat;
        display: flex;
        /* align-items: center; */
        justify-content: center;
    }

    .login_region {
        background: linear-gradient(to bottom right,
                rgba(0, 0, 0, 0.8),
                rgba(0, 0, 0, 0.2));
        height: 40vh;
        width: 15vw;
        border: 2px solid lightblue;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    .login_username,
    .login_password {
        width: 90%;
        height: 50px;
        border-radius: 12px;
        margin-top: 20px;
        margin-bottom: 20px;

    }

    .login_username input,
    .login_password input {
        width: 100%;
        height: 100%;
        margin: 0px;
        padding: 0px;
        border-radius: 12px;
        background: linear-gradient(to bottom right,
                rgba(0, 0, 0, 0.8),
                rgba(0, 0, 0, 0.2));
        color: white;
    }

    .login_button button {
        width: 80px;
        height: 30px;
        padding: 0px;
        margin-top: 0px;
        background: linear-gradient(to bottom right,
                rgba(0, 0, 0, 0.8),
                rgba(0, 0, 0, 0.2));
        color: white;
    }
</style>

<script>
    const account = [
        ["yongzhang", "123456"]
    ]

    document.getElementById("submit_button").addEventListener("click", function () {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        const isValid = account.some(acc => acc[0] === username && acc[1] === password);

        if (isValid){
            window.location.href = "index.html"
        } else{
            alert("账号密码错误。")
        }

    }

    )
</script>
